baseURL = "https://ctmt1406.github.io/InternshipReport/"
title = "Internship Report"
canonifyURLs = true
theme = "hugo-theme-learn"
defaultContentLanguage = "en"

[outputs]
home = ["HTML", "RSS", "JSON"]   # JSON để ô tìm kiếm hoạt động

[params]
  themeVariant = "workshop"      # màu theo template FCAJ (static/css/theme-workshop.css)
  author = "Chau Tran Manh Tien"
  editURL = "https://github.com/CTMT1406/InternshipReport/edit/main/content/"
  showVisitedLinks = true
  disableNextPrev = false
  disableLandingPageButton = true   # ẩn nút Home ở sidebar (giống template FCAJ); bấm logo để về trang chủ

[languages.en]
  title = "Internship Report"
  weight = 1
  languageName = "English"

  [[languages.en.menu.shortcuts]]
    name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
    identifier = "aws-study-group-blog"
    url = "https://awsstudygroup.com"
    weight = 10
  [[languages.en.menu.shortcuts]]
    name = "<i class='fab fa-facebook'></i> AWS Study Group - FB Group"
    identifier = "aws-study-group-fb"
    url = "https://www.facebook.com/groups/awsstudygroupfcj"
    weight = 20
[languages.vi]
  title = "Báo cáo thực tập"
  weight = 2
  languageName = "Tiếng Việt"

  [[languages.vi.menu.shortcuts]]
    name = "<i class='fab fa-aws'></i> AWS Study Group - Blog"
    identifier = "aws-study-group-blog"
    url = "https://awsstudygroup.com"
    weight = 10
  [[languages.vi.menu.shortcuts]]
    name = "<i class='fab fa-facebook'></i> AWS Study Group - Nhóm FB"
    identifier = "aws-study-group-fb"
    url = "https://www.facebook.com/groups/awsstudygroupfcj"
    weight = 20

[markup.goldmark.renderer]
  unsafe = true                  # cho phép chèn HTML trong markdown